<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloombly — Global Bloom Detection &amp; Forecasting</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Component Styles -->
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/topSelector.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
  <link rel="stylesheet" href="/styles/timeline.css">
  <link rel="stylesheet" href="/styles/descriptionCard.css">
  <link rel="stylesheet" href="/styles/metricsCard.css">
  <link rel="stylesheet" href="/styles/advancedFilters.css">
  <link rel="stylesheet" href="/styles/legend.css">
  <link rel="stylesheet" href="/styles/intro.css">
</head>
<body>
  <div id="globeViz"></div>
  
  <!-- Top Selector -->
  <div id="top-selector-container"></div>
  
  <!-- Unified Sidebar (Left) -->
  <div id="unified-sidebar-container"></div>
  
  <!-- Timeline Component -->
  <div id="timeline-container"></div>

  <!-- External Libraries -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <!-- globe.gl pinned to a build compatible with three r152 (latest requires THREE.Timer, absent in r152) -->
  <script src="https://unpkg.com/globe.gl@2.33.0/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <!-- Optional: set this to your deployed ML API origin to enable live "Predict blooms".
       Leave it commented for the static demo — the globe works fully without an API. -->
  <!-- <script>window.BLOOMBLY_API_URL = "https://your-api.example.com/api";</script> -->

  <!-- Application Scripts -->
  <script type="module" src="/js/config.js"></script>
  <script type="module" src="/js/state.js"></script>
  <script type="module" src="/js/globe.js"></script>
  <script type="module" src="/js/components/topSelector.js"></script>
  <script type="module" src="/js/components/unifiedSidebar.js"></script>
  <script type="module" src="/js/components/timeline.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
